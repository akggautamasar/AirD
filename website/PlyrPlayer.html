<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>

    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
        }

        .plyr {
            width: 100%;
            height: 100%;
        }

        .plyr__video-wrapper {
            background: #000;
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 38, 38, 0.95);
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 90%;
            width: 500px;
            text-align: center;
            font-size: 1rem;
            line-height: 1.6;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }

        .error-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .error-details {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-overlay.hidden {
            display: none;
        }

        .plyr--full-ui input[type=range] {
            color: #0ea5e9;
        }

        .plyr__control--overlaid {
            background: rgba(14, 165, 233, 0.9);
        }

        .plyr__control--overlaid:hover {
            background: rgba(14, 165, 233, 1);
        }

        .plyr__menu__container .plyr__control[role=menuitemradio][aria-checked=true]::before {
            background: #0ea5e9;
        }
    </style>
</head>

<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="player-container">
        <div class="video-wrapper">
            <video id="player" playsinline controls preload="metadata">
                <source id="videoSource" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const videoSource = document.getElementById('videoSource');
        const videoElement = document.getElementById('player');

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

        function showError(title, message, details) {
            hideLoading();
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `
                <div class="error-title">${title}</div>
                <div>${message}</div>
                ${details ? `<div class="error-details">${details}</div>` : ''}
            `;
            document.body.appendChild(errorDiv);
        }

        function detectVideoType(url) {
            const extension = url.split('.').pop().split('?')[0].toLowerCase();
            const typeMap = {
                'mp4': 'video/mp4',
                'm4v': 'video/mp4',
                'webm': 'video/webm',
                'ogg': 'video/ogg',
                'ogv': 'video/ogg',
                'mkv': 'video/x-matroska',
                'avi': 'video/x-msvideo',
                'mov': 'video/quicktime',
                'wmv': 'video/x-ms-wmv',
                'flv': 'video/x-flv',
                'ts': 'video/mp2t',
                'mpg': 'video/mpeg',
                'mpeg': 'video/mpeg',
                '3gp': 'video/3gpp',
            };
            return typeMap[extension] || 'video/mp4';
        }

        if (!videoUrl) {
            showError('No Video URL', 'No video URL was provided in the query parameters.', 'Please ensure you\'re accessing this page with a valid ?url= parameter.');
        } else {
            console.log('Loading video:', videoUrl);

            const videoType = detectVideoType(videoUrl);
            console.log('Detected video type:', videoType);

            videoSource.src = videoUrl;
            videoSource.type = videoType;

            const player = new Plyr('#player', {
                controls: [
                    'play-large',
                    'play',
                    'progress',
                    'current-time',
                    'duration',
                    'mute',
                    'volume',
                    'settings',
                    'pip',
                    'airplay',
                    'fullscreen'
                ],
                settings: ['quality', 'speed', 'loop'],
                speed: {
                    selected: 1,
                    options: [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3]
                },
                ratio: '16:9',
                fullscreen: {
                    enabled: true,
                    fallback: true,
                    iosNative: true
                },
                autopause: false,
                resetOnEnd: false,
                hideControls: true,
                keyboard: {
                    focused: true,
                    global: true
                }
            });

            videoElement.addEventListener('loadstart', () => {
                console.log('Video load started');
            });

            videoElement.addEventListener('loadedmetadata', () => {
                console.log('Video metadata loaded');
                console.log('Duration:', videoElement.duration);
                console.log('Dimensions:', videoElement.videoWidth + 'x' + videoElement.videoHeight);
                hideLoading();
            });

            videoElement.addEventListener('canplay', () => {
                console.log('Video can play');
                hideLoading();
            });

            videoElement.addEventListener('waiting', () => {
                console.log('Video buffering...');
            });

            videoElement.addEventListener('playing', () => {
                console.log('Video playing');
            });

            videoElement.addEventListener('error', (e) => {
                console.error('Video error:', e, videoElement.error);

                let errorTitle = 'Video Playback Error';
                let errorMessage = 'Unable to play this video.';
                let errorDetails = '';

                if (videoElement.error) {
                    const errorCodes = {
                        1: 'MEDIA_ERR_ABORTED: Video playback was aborted.',
                        2: 'MEDIA_ERR_NETWORK: Network error while loading video.',
                        3: 'MEDIA_ERR_DECODE: Video decoding failed.',
                        4: 'MEDIA_ERR_SRC_NOT_SUPPORTED: Video format not supported.'
                    };

                    errorMessage = errorCodes[videoElement.error.code] || `Error code: ${videoElement.error.code}`;

                    errorDetails = `<strong>Troubleshooting:</strong><br>
                        • Check your internet connection<br>
                        • Try refreshing the page<br>
                        • Ensure the video file is not corrupted<br>
                        • Try a different browser<br>
                        • Large files may take time to buffer`;

                    if (videoElement.error.message) {
                        errorDetails = videoElement.error.message + '<br><br>' + errorDetails;
                    }
                }

                showError(errorTitle, errorMessage, errorDetails);
            });

            videoElement.addEventListener('stalled', () => {
                console.log('Video stalled - network may be slow');
            });

            videoElement.addEventListener('suspend', () => {
                console.log('Video data loading suspended');
            });

            player.on('ready', () => {
                console.log('Player ready');
                hideLoading();
            });

            player.on('error', (event) => {
                console.error('Plyr error:', event);
            });

            player.on('progress', (event) => {
                if (videoElement.buffered.length > 0) {
                    const bufferedEnd = videoElement.buffered.end(videoElement.buffered.length - 1);
                    const duration = videoElement.duration;
                    if (duration > 0) {
                        const bufferedPercent = (bufferedEnd / duration) * 100;
                        console.log('Buffered:', bufferedPercent.toFixed(1) + '%');
                    }
                }
            });
        }
    </script>
</body>

</html>
